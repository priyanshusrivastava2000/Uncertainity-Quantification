[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adniuq"
version = "1.0.0"
description = "Uncertainty-aware CLG-Lasso classifiers for MCI-to-AD conversion on ADNI baseline data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "XlsxWriter>=3.1",
]

[project.scripts]
adniuq = "adniuq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
