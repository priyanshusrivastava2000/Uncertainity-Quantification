name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src run.py

      - name: Import every stage
        run: |
          python - <<'PY'
          import importlib
          from adniuq.stages import STAGES
          for stage in STAGES:
              importlib.import_module(f"adniuq.stages.{stage}")
          print(f"{len(STAGES)} stages import cleanly")
          PY

      - name: CLI smoke test
        run: |
          python run.py list
          adniuq --help
